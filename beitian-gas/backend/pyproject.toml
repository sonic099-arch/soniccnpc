[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "beitian-gas-api"
version = "0.2.0"
requires-python = ">=3.12,<3.13"
dependencies = [
 "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1", "sqlalchemy>=2.0,<2.1",
 "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4", "pydantic-settings>=2.7,<3",
 "pandas>=2.2,<3", "numpy>=2.0,<3", "openpyxl>=3.1,<4", "python-multipart>=0.0.20,<1"
]
[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<1", "pgserver==0.1.4"]
[tool.setuptools.packages.find]
include = ["app*"]
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
